name: Validate study site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and validate mathematics and links
        run: |
          python -m pip install -r requirements-build.txt
          python build.py
          python validate.py
          python scripts/check-build-newlines.py
          node --check assets/site.js
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile pages
        run: node scripts/browser-smoke.cjs
      - name: Check deployed Pages after a main update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SITE_BASE_URL: https://yizhouren0622-create.github.io/Probability-Theory-and-Mathematical-Statistics/
        run: node scripts/browser-smoke.cjs
      - name: Retain page checks and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-review
          path: artifacts/browser/
          retention-days: 7
